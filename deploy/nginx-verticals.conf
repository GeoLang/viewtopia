server {
    listen 5174;
    root /usr/share/nginx/html;
    index index.html;

    # Delivery optimization → itinera
    location /api/delivery/ {
        proxy_pass http://itinera:3000/delivery/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Routing → itinera
    location /api/route {
        proxy_pass http://itinera:3000/route;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/isochrone {
        proxy_pass http://itinera:3000/isochrone;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Geocoding → geokode
    location /api/geocode/ {
        proxy_pass http://geokode:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else → ptolemy
    location /api/ {
        proxy_pass http://ptolemy:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket for real-time fleet/sensor updates
    location /ws/ {
        proxy_pass http://ptolemy:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
