server {
    listen 5174;
    root /usr/share/nginx/html;
    index index.html;

    # ── AI Agent ────────────────────────────────────────────────────
    location /agent/ {
        proxy_pass http://geolang:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── 3D Tiles / Terrain ──────────────────────────────────────────
    location /tiles/ {
        proxy_pass http://tiletopia:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Routing ─────────────────────────────────────────────────────
    location /api/delivery/ {
        proxy_pass http://itinera:3000/delivery/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/route {
        proxy_pass http://itinera:3000/route;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/isochrone {
        proxy_pass http://itinera:3000/isochrone;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Geocoding ───────────────────────────────────────────────────
    location /api/geocode/ {
        proxy_pass http://geokode:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Ptolemy (geodatabase + geoprocessing) ───────────────────────
    location /api/ {
        proxy_pass http://ptolemy:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── WebSocket ───────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://ptolemy:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── SSE ─────────────────────────────────────────────────────────
    location /api/v1/sse {
        proxy_pass http://ptolemy:3000/api/v1/sse;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Frontend SPA ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
