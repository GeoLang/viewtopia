server {
    listen 5174;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve upstreams at request time, not startup.
    # NOTE: because each proxy_pass below uses a variable (to defer DNS), nginx does
    # NOT auto-append the matched location URI. We therefore rewrite the path
    # explicitly (with `break`, which also preserves the query string) before
    # proxying. Without the rewrite, the URI suffix + query string are dropped.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── AI Agent ────────────────────────────────────────────────────
    location /agent/ {
        # geolang's FastAPI app (chat/agui SSE); it proxies agent runs to sibyl.
        set $upstream_geolang geolang-api;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://$upstream_geolang:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        # SSE: stream tokens through without buffering.
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Realtime collaboration (websocket) ─────────────────────────
    # the viewer opens ws://<host>/api/v1/realtime/<room>; that path belongs
    # to tiletopia, not ptolemy, and needs the Upgrade handshake forwarded.
    location /api/v1/realtime/ {
        set $upstream_tiletopia tiletopia;
        proxy_pass http://$upstream_tiletopia:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── 3D Tiles / Terrain ──────────────────────────────────────────
    location /tiles/ {
        set $upstream_tiletopia tiletopia;
        rewrite ^/tiles/(.*)$ /api/$1 break;
        proxy_pass http://$upstream_tiletopia:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── OGC services (WMS/WFS/WMTS/WCS/OGC API Features) ────────────
    # fenestra's own routes are /wms, /wfs, /wmts, /wcs and /ogc/*, so its OGC
    # API Features landing page lands on /ogc/ogc/ through here. Its capabilities
    # emit absolute URLs, so compose must set FENESTRA_PUBLIC_URL to <origin>/ogc
    # or clients follow them straight back to the published :3003.
    location /ogc/ {
        set $upstream_fenestra fenestra;
        rewrite ^/ogc/(.*)$ /$1 break;
        proxy_pass http://$upstream_fenestra:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Routing ─────────────────────────────────────────────────────
    location /api/delivery/ {
        set $upstream_itinera itinera;
        rewrite ^/api/delivery/(.*)$ /delivery/$1 break;
        proxy_pass http://$upstream_itinera:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/route {
        set $upstream_itinera itinera;
        rewrite ^/api/route$ /route break;
        proxy_pass http://$upstream_itinera:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/isochrone {
        set $upstream_itinera itinera;
        rewrite ^/api/isochrone$ /isochrone break;
        proxy_pass http://$upstream_itinera:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # od-matrix, closest-facility, components and betweenness. Without this they
    # would fall through to the /api/ block and reach ptolemy instead.
    location /api/network/ {
        set $upstream_itinera itinera;
        rewrite ^/api/network/(.*)$ /network/$1 break;
        proxy_pass http://$upstream_itinera:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Pipeline run history (geodukt) ──────────────────────────────
    # geodukt has no published port, so this is the only way in. Only the runs
    # subtree is proxied: /run executes a manifest, and the agent already reaches
    # it from inside the network, so it stays off the public edge. geodukt checks
    # the platform JWT on /runs itself and decides whose runs come back, which is
    # why the bearer passes through untouched.
    location /api/pipeline/runs {
        set $upstream_geodukt geodukt;
        rewrite ^/api/pipeline/(.*)$ /$1 break;
        proxy_pass http://$upstream_geodukt:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Indoor maps (interiora) ─────────────────────────────────────
    # its routes are /venues*, so strip the whole /api/indoor prefix. Every one
    # of them validates the platform JWT itself, which passes through untouched.
    location /api/indoor/ {
        set $upstream_interiora interiora;
        rewrite ^/api/indoor/(.*)$ /$1 break;
        proxy_pass http://$upstream_interiora:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Live shared map documents (agora) ───────────────────────────
    # its routes are /documents, /links and /ws, so strip the /agora prefix.
    # /ws holds a websocket open per participant, hence the upgrade headers
    # and the long read timeout. auth rides the Sec-WebSocket-Protocol
    # subprotocol (or Authorization header), which proxy_pass forwards as-is.
    location /agora/ {
        set $upstream_agora agora;
        rewrite ^/agora/(.*)$ /$1 break;
        proxy_pass http://$upstream_agora:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Windowed raster tiles (geoplumb) ────────────────────────────
    # its routes are /layers and /tiles/*, so strip the whole /plumb prefix.
    # Public on purpose: these are tiles rendered from public STAC collections,
    # so no token is sent and none is checked.
    location /plumb/ {
        set $upstream_geoplumb geoplumb;
        rewrite ^/plumb/(.*)$ /$1 break;
        proxy_pass http://$upstream_geoplumb:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # a cold tile searches STAC and reads COGs over http range requests
        proxy_read_timeout 300s;
    }

    # ── Geocoding ───────────────────────────────────────────────────
    location /api/geocode/ {
        set $upstream_geokode geokode;
        rewrite ^/api/geocode/(.*)$ /$1 break;
        proxy_pass http://$upstream_geokode:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── OIDC (ptolemy, not tiletopia) ───────────────────────────────
    # ptolemy owns /api/v1/auth/oidc/* and tiletopia owns the rest of
    # /api/v1/auth/*. Both are prefix locations, so nginx picks this one for the
    # oidc paths on longest-prefix match and the block order below does not
    # matter. Without it, ptolemy's login and callback land on tiletopia.
    # the hosted stack's platform-proxy Caddyfile mirrors these locations, so a
    # change here needs the matching change there.
    location /api/v1/auth/oidc/ {
        set $upstream_ptolemy ptolemy;
        rewrite ^/api/v1/auth/oidc/(.*)$ /api/v1/auth/oidc/$1 break;
        proxy_pass http://$upstream_ptolemy:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Auth (users / JWT) ──────────────────────────────────────────
    location /api/v1/auth/ {
        set $upstream_tiletopia tiletopia;
        rewrite ^/api/v1/auth/(.*)$ /api/v1/auth/$1 break;
        proxy_pass http://$upstream_tiletopia:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Portal (content catalog) ────────────────────────────────────
    location /api/v1/portal/ {
        set $upstream_tiletopia tiletopia;
        rewrite ^/api/v1/portal/(.*)$ /api/v1/portal/$1 break;
        proxy_pass http://$upstream_tiletopia:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Ptolemy (geodatabase + geoprocessing) ───────────────────────
    location /api/ {
        set $upstream_ptolemy ptolemy;
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream_ptolemy:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── WebSocket ───────────────────────────────────────────────────
    location /ws/ {
        set $upstream_ptolemy ptolemy;
        rewrite ^/ws/(.*)$ /ws/$1 break;
        proxy_pass http://$upstream_ptolemy:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── SSE ─────────────────────────────────────────────────────────
    location /api/v1/sse {
        set $upstream_ptolemy ptolemy;
        rewrite ^/api/v1/sse$ /api/v1/sse break;
        proxy_pass http://$upstream_ptolemy:3000;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Jupyter (python notebook kernels) ───────────────────────────
    location /jupyter/ {
        set $upstream_jupyter jupyter;
        # base_url=/jupyter, so keep the prefix (don't strip it).
        rewrite ^/jupyter/(.*)$ /jupyter/$1 break;
        proxy_pass http://$upstream_jupyter:8888;
        # kernel channels are websockets: forward the Upgrade handshake.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Metrics (never proxied) ─────────────────────────────────────
    #
    # ptolemy's Prometheus output keys request counts and latencies by path, so
    # it exposes identifiers and traffic shape. No location here proxies it, and
    # this exact match keeps the SPA fallback from making /metrics look alive.
    # ptolemy also requires an admin token for it, because compose publishes its
    # port 3000 straight to the host and bypasses this proxy.
    #
    # To let a scraper through, replace the return with:
    #     allow 10.0.0.0/8;   # scraper subnet
    #     deny all;
    #     set $upstream_ptolemy ptolemy;
    #     rewrite ^/metrics$ /metrics break;
    #     proxy_pass http://$upstream_ptolemy:3000;
    # and give the scraper an admin bearer token.
    location = /metrics {
        return 404;
    }

    # ── Frontend SPA ────────────────────────────────────────────────
    # index.html must never be cached: it names the hashed bundle, and a stale
    # copy after a redeploy loads a bundle that no longer exists (blank app).
    # the hashed /assets/ files are immutable by construction.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # vite emits module workers (pdfjs) as .mjs, which mime.types does not map,
    # and a module script served as octet-stream is refused by the browser
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
