server {
    listen 5174;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve upstreams at request time, not startup
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── AI Agent ────────────────────────────────────────────────────
    location /agent/ {
        set $upstream_geolang geolang;
        proxy_pass http://$upstream_geolang:8283/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── 3D Tiles / Terrain ──────────────────────────────────────────
    location /tiles/ {
        set $upstream_tiletopia tiletopia;
        proxy_pass http://$upstream_tiletopia:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Routing ─────────────────────────────────────────────────────
    location /api/delivery/ {
        set $upstream_itinera itinera;
        proxy_pass http://$upstream_itinera:3000/delivery/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/route {
        set $upstream_itinera itinera;
        proxy_pass http://$upstream_itinera:3000/route;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/isochrone {
        set $upstream_itinera itinera;
        proxy_pass http://$upstream_itinera:3000/isochrone;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Geocoding ───────────────────────────────────────────────────
    location /api/geocode/ {
        set $upstream_geokode geokode;
        proxy_pass http://$upstream_geokode:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Ptolemy (geodatabase + geoprocessing) ───────────────────────
    location /api/ {
        set $upstream_ptolemy ptolemy;
        proxy_pass http://$upstream_ptolemy:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── WebSocket ───────────────────────────────────────────────────
    location /ws/ {
        set $upstream_ptolemy ptolemy;
        proxy_pass http://$upstream_ptolemy:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── SSE ─────────────────────────────────────────────────────────
    location /api/v1/sse {
        set $upstream_ptolemy ptolemy;
        proxy_pass http://$upstream_ptolemy:3000/api/v1/sse;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Frontend SPA ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
