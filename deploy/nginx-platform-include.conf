# conf.d entry point for the platform stack.
#
# A single-file bind mount pins the inode, so edits to the mounted file need a
# container recreate. This stub is the only file mounted that way (it never
# changes); the real config is included from the deploy/ directory mount, so
# editing nginx-platform.conf on the host and running
#   docker compose -f docker-compose.platform.yml exec viewtopia nginx -s reload
# picks the edit up.
include /etc/nginx/platform/nginx-platform.conf;
