name: Platform E2E (golden path)

# Runs the platform Playwright suite (tests/e2e/golden-path.spec.js and
# tests/e2e/live-session.spec.js among them, see playwright.platform.config.js)
# against the REAL platform stack — no geolang stub. This is the "is it
# shippable?" gate.
#
# Optional repository secrets:
#   XAI_API_KEY - (optional) written into geolang/.env as SIBYL_CLOUD_API_KEY. The
#                 golden path does not issue an LLM call, so an absent secret still
#                 passes. Provide it if you later add an agent NL->map step.
#
# Building seven Rust service images from scratch is slow, so this does NOT run on every
# PR — only master pushes that touch code, the weekly schedule, and manual dispatch.
# Docs-only pushes are skipped: a run takes ~30 min and cancel-in-progress means a
# markdown commit would otherwise kill the run testing the code before it.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: platform-e2e
  cancel-in-progress: true

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # throwaway secret for this ephemeral CI stack, not a real credential. the
    # fail-closed services refuse to start without it, and the e2e mints editor
    # tokens from the same value (scripts/platform-token.mjs reads this var).
    env:
      PLATFORM_JWT_SECRET: ci-platform-e2e-secret-not-for-production-use
      TILETOPIA_ION_BASE_URL: http://localhost:5174
    steps:
      - name: Checkout viewtopia
        uses: actions/checkout@v4
        with:
          path: viewtopia

      - name: Checkout ptolemy
        uses: actions/checkout@v4
        with: { repository: GeoLang/ptolemy, path: ptolemy }
      - name: Checkout tiletopia
        uses: actions/checkout@v4
        with: { repository: GeoLang/tiletopia, path: tiletopia }
      - name: Checkout geokode
        uses: actions/checkout@v4
        with: { repository: GeoLang/geokode, path: geokode }
      - name: Checkout itinera
        uses: actions/checkout@v4
        with: { repository: GeoLang/itinera, path: itinera }
      - name: Checkout agora
        uses: actions/checkout@v4
        with: { repository: GeoLang/agora, path: agora }

      - name: Checkout geolang
        uses: actions/checkout@v4
        with: { repository: GeoLang/geolang, path: geolang }
      - name: Checkout sibyl
        uses: actions/checkout@v4
        with: { repository: GeoLang/sibyl, path: sibyl }
      - name: Checkout geodukt
        uses: actions/checkout@v4
        with: { repository: GeoLang/geodukt, path: geodukt }
      - name: Checkout collecta
        uses: actions/checkout@v4
        with: { repository: GeoLang/collecta, path: collecta }

      # sibyl treats an empty key as unset and refuses to start against the
      # cloud base, so an absent secret must fall back to a non-empty dummy
      - name: Write geolang/.env
        run: |
          cat > geolang/.env <<EOF
          SIBYL_CLOUD_API_KEY=${{ secrets.XAI_API_KEY || 'ci-dummy-key-not-real' }}
          EOF

      # the geolang image installs QGIS from qgis.org, which goes 503 for hours
      # at a time. its layers are cached across runs so an outage only bites
      # when the Dockerfile changed. compose reuses the loaded tag on `up`.
      - uses: docker/setup-buildx-action@v4
      - name: Build the geolang image with a layer cache
        uses: docker/build-push-action@v7
        with:
          context: geolang
          load: true
          tags: geolang-platform:latest
          cache-from: type=gha,scope=geolang-platform
          cache-to: type=gha,scope=geolang-platform,mode=max

      # the executor refuses to start without it, and compose defaults it empty
      - name: Generate the executor secret
        run: echo "GEOLANG_EXECUTOR_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - uses: ./viewtopia/.github/actions/platform-stack-up
        with:
          build-services: ptolemy tiletopia geokode itinera agora sibyl geodukt collecta viewtopia
          start-services: ptolemy tiletopia geokode itinera agora sibyl geodukt collecta geolang-api jupyter viewtopia
          # geolang-api only waits for the executor to start, not to be ready,
          # and the tool-run spec calls a tool that runs there
          health-services: ptolemy tiletopia geokode itinera agora sibyl geodukt collecta geolang-api geolang-executor jupyter

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: viewtopia/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewtopia/pnpm-lock.yaml

      - name: Install deps + Playwright
        working-directory: viewtopia
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run platform E2E
        working-directory: viewtopia
        run: pnpm run test:e2e:platform

      - name: Dump service logs on failure
        if: failure()
        working-directory: viewtopia
        run: docker compose -f docker-compose.platform.yml logs --no-color --tail=200
