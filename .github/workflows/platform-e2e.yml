name: Platform E2E (golden path)

# Runs the platform Playwright suite (tests/e2e/golden-path.spec.js and
# tests/e2e/live-session.spec.js among them, see playwright.platform.config.js)
# against the REAL platform stack — no geolang stub. This is the "is it
# shippable?" gate.
#
# Optional repository secrets:
#   XAI_API_KEY     - (optional) written into geolang/.env. The golden path does not
#   OPENAI_API_KEY  - (optional) issue an LLM call, so empty values still pass; provide
#                     them if you later add an agent NL->map step.
#
# Building seven Rust service images from scratch is slow, so this does NOT run on every
# PR — only master pushes that touch code, the weekly schedule, and manual dispatch.
# Docs-only pushes are skipped: a run takes ~30 min and cancel-in-progress means a
# markdown commit would otherwise kill the run testing the code before it.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: platform-e2e
  cancel-in-progress: true

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # throwaway secret for this ephemeral CI stack, not a real credential. the
    # fail-closed services refuse to start without it, and the e2e mints editor
    # tokens from the same value (scripts/platform-token.mjs reads this var).
    env:
      PLATFORM_JWT_SECRET: ci-platform-e2e-secret-not-for-production-use
    steps:
      - name: Checkout viewtopia
        uses: actions/checkout@v4
        with:
          path: viewtopia

      - name: Checkout ptolemy
        uses: actions/checkout@v4
        with: { repository: GeoLang/ptolemy, path: ptolemy }
      - name: Checkout tiletopia
        uses: actions/checkout@v4
        with: { repository: GeoLang/tiletopia, path: tiletopia }
      - name: Checkout geokode
        uses: actions/checkout@v4
        with: { repository: GeoLang/geokode, path: geokode }
      - name: Checkout itinera
        uses: actions/checkout@v4
        with: { repository: GeoLang/itinera, path: itinera }
      - name: Checkout agora
        uses: actions/checkout@v4
        with: { repository: GeoLang/agora, path: agora }

      - name: Checkout geolang
        uses: actions/checkout@v4
        with: { repository: GeoLang/geolang, path: geolang }
      - name: Checkout sibyl
        uses: actions/checkout@v4
        with: { repository: GeoLang/sibyl, path: sibyl }
      - name: Checkout geodukt
        uses: actions/checkout@v4
        with: { repository: GeoLang/geodukt, path: geodukt }

      # sibyl treats an empty key as unset and refuses to start against the
      # cloud base, so an absent secret must fall back to a non-empty dummy
      - name: Write geolang/.env
        run: |
          cat > geolang/.env <<EOF
          XAI_API_KEY=${{ secrets.XAI_API_KEY || 'ci-dummy-key-not-real' }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EOF

      - name: Download OSM extract for routing
        working-directory: viewtopia
        run: |
          scripts/fetch-osm-extract.sh \
            https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
            data/region.osm.pbf

      - name: Build platform images (golden-path subset)
        working-directory: viewtopia
        run: |
          docker compose -f docker-compose.platform.yml build \
            ptolemy tiletopia geokode itinera agora geolang-api sibyl geodukt viewtopia

      # itinera's entrypoint builds data/graph.bin from the extract on first start,
      # so there is no separate graph-build step.
      - name: Start the stack
        working-directory: viewtopia
        run: |
          # geodukt runs as this uid so its sinks can write the bind-mounted
          # checkout, which the runner owns rather than the compose default 1000
          export DOCKER_UID="$(id -u)" DOCKER_GID="$(id -g)"
          docker compose -f docker-compose.platform.yml down --remove-orphans
          docker compose -f docker-compose.platform.yml up -d \
            ptolemy tiletopia geokode itinera agora sibyl geodukt geolang-api jupyter viewtopia

      - name: Wait for all services healthy
        working-directory: viewtopia
        run: |
          services="ptolemy tiletopia geokode itinera agora sibyl geodukt geolang-api jupyter"
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            pending=""
            for s in $services; do
              cid=$(docker compose -f docker-compose.platform.yml ps -q "$s")
              st=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
              [ "$st" = "healthy" ] || pending="$pending $s($st)"
            done
            # viewtopia has no healthcheck — probe its port directly
            curl -sf -o /dev/null http://localhost:5174/ || pending="$pending viewtopia(down)"
            [ -z "$pending" ] && { echo "all healthy"; break; }
            [ "$(date +%s)" -ge "$deadline" ] && { echo "TIMEOUT waiting for:$pending"; exit 1; }
            echo "waiting for:$pending"; sleep 5
          done

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: viewtopia/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewtopia/pnpm-lock.yaml

      - name: Install deps + Playwright
        working-directory: viewtopia
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run platform E2E
        working-directory: viewtopia
        run: pnpm run test:e2e:platform

      - name: Dump service logs on failure
        if: failure()
        working-directory: viewtopia
        run: docker compose -f docker-compose.platform.yml logs --no-color --tail=200
