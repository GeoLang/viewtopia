name: Platform Docker Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow manual trigger for testing
  workflow_dispatch:
  # Run weekly to catch upstream breakage
  schedule:
    - cron: "0 6 * * 1"

jobs:
  platform-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout viewtopia
        uses: actions/checkout@v4
        with:
          path: viewtopia

      - name: Checkout ptolemy
        uses: actions/checkout@v4
        with:
          repository: GeoLang/ptolemy
          path: ptolemy

      - name: Checkout tiletopia
        uses: actions/checkout@v4
        with:
          repository: GeoLang/tiletopia
          path: tiletopia

      - name: Checkout geokode
        uses: actions/checkout@v4
        with:
          repository: GeoLang/geokode
          path: geokode

      - name: Checkout itinera
        uses: actions/checkout@v4
        with:
          repository: GeoLang/itinera
          path: itinera

      - name: Checkout geolang
        uses: actions/checkout@v4
        with:
          repository: GeoLang/geolang
          path: geolang
        continue-on-error: true

      - name: Checkout fenestra
        uses: actions/checkout@v4
        with:
          repository: GeoLang/fenestra
          path: fenestra

      - name: Build platform Docker images (excluding optional services)
        working-directory: viewtopia
        run: |
          # Build only services whose repos are available
          SERVICES="ptolemy tiletopia geokode itinera viewtopia"
          if [ -d ../geolang ]; then SERVICES="$SERVICES geolang"; fi
          if [ -d ../fenestra ]; then SERVICES="$SERVICES fenestra"; fi
          docker compose -f docker-compose.platform.yml build $SERVICES

      - name: Verify images created
        run: |
          docker images | grep -E "viewtopia-(ptolemy|tiletopia|geokode|itinera|viewtopia)"
