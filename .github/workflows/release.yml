name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Package dist
        run: tar czf viewtopia-${{ github.ref_name }}.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with:
          name: viewtopia-dist
          path: viewtopia-${{ github.ref_name }}.tar.gz
      - name: Package platform bundle
        run: |
          set -eu
          staging=geolang-platform-${{ github.ref_name }}
          mkdir -p "$staging/scripts" "$staging/data"
          cp docker-compose.platform.yml docker-compose.release.yml "$staging/"
          cp -r deploy "$staging/deploy"
          # ptolemy-seed.mjs and platform-token.mjs are what seed-parcels.mjs imports
          cp scripts/fetch-osm-extract.sh scripts/platform-token.mjs \
             scripts/ptolemy-seed.mjs scripts/seed-parcels.mjs "$staging/scripts/"
          cp release-bundle/README.md release-bundle/.env.platform.example \
             release-bundle/geolang.env.example "$staging/"
          tar czf "$staging.tar.gz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: geolang-platform-bundle
          path: geolang-platform-${{ github.ref_name }}.tar.gz

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/geolang/viewtopia:${{ github.ref_name }}
            ghcr.io/geolang/viewtopia:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # a nameless download takes every artifact in the run, and the docker
          # job's *.dockerbuild build record is not one this action can extract
          pattern: "!*.dockerbuild"
          merge-multiple: true
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release-artifacts/*.tar.gz"
          generate_release_notes: true
