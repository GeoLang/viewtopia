name: Platform panels (per-panel functional)

# Runs the per-panel functional suite (tests/e2e/panels/, playwright.panels.config.js)
# against the REAL platform stack. Each spec drives one menu group's panels and reads
# the effect back out of the live renderer or a platform backend.
#
# Never runs on push or pull_request: it boots the whole data plane and opens the app
# once per panel under software GL, which is far too slow for a PR diff. The golden
# path (platform-e2e.yml) stays the per-push gate.
#
# geolang is deliberately not started, same as platform-load.yml: no panel spec talks
# to the agent, and its image is the slowest thing in the stack to build and boot.
#
# Third-party APIs the panels use (open-meteo, overpass) are stubbed in the specs with
# page.route, so this job needs no external API keys.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: platform-panels
  cancel-in-progress: true

jobs:
  panels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # throwaway secret for this ephemeral CI stack, not a real credential. the
    # fail-closed services refuse to start without it, and the panel specs mint
    # editor/admin tokens from the same value (scripts/platform-token.mjs reads it).
    env:
      PLATFORM_JWT_SECRET: ci-platform-panels-secret-not-for-production-use
    steps:
      - name: Checkout viewtopia
        uses: actions/checkout@v4
        with:
          path: viewtopia

      - name: Checkout ptolemy
        uses: actions/checkout@v4
        with: { repository: GeoLang/ptolemy, path: ptolemy }
      - name: Checkout tiletopia
        uses: actions/checkout@v4
        with: { repository: GeoLang/tiletopia, path: tiletopia }
      - name: Checkout fenestra
        uses: actions/checkout@v4
        with: { repository: GeoLang/fenestra, path: fenestra }
      - name: Checkout geokode
        uses: actions/checkout@v4
        with: { repository: GeoLang/geokode, path: geokode }
      - name: Checkout itinera
        uses: actions/checkout@v4
        with: { repository: GeoLang/itinera, path: itinera }

      - name: Download OSM extract for routing and geocoding
        working-directory: viewtopia
        run: |
          scripts/fetch-osm-extract.sh \
            https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
            data/region.osm.pbf

      - name: Build platform images (data plane only)
        working-directory: viewtopia
        run: |
          docker compose -f docker-compose.platform.yml build \
            ptolemy tiletopia fenestra geokode itinera viewtopia

      # itinera's entrypoint builds data/graph.bin from the extract on first
      # start, so there is no separate graph-build step.
      - name: Start the stack
        working-directory: viewtopia
        run: |
          docker compose -f docker-compose.platform.yml down --remove-orphans
          docker compose -f docker-compose.platform.yml up -d \
            ptolemy tiletopia fenestra geokode itinera viewtopia

      - name: Wait for all services healthy
        working-directory: viewtopia
        run: |
          services="ptolemy tiletopia fenestra geokode itinera"
          deadline=$(( $(date +%s) + 600 ))   # itinera builds its routing graph on first boot
          while :; do
            pending=""
            for s in $services; do
              cid=$(docker compose -f docker-compose.platform.yml ps -q "$s")
              st=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
              [ "$st" = "healthy" ] || pending="$pending $s($st)"
            done
            # viewtopia has no healthcheck, so probe its port directly
            curl -sf -o /dev/null http://localhost:5174/ || pending="$pending viewtopia(down)"
            [ -z "$pending" ] && { echo "all healthy"; break; }
            [ "$(date +%s)" -ge "$deadline" ] && { echo "TIMEOUT waiting for:$pending"; exit 1; }
            echo "waiting for:$pending"; sleep 5
          done

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: viewtopia/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewtopia/pnpm-lock.yaml

      - name: Install deps + Playwright
        working-directory: viewtopia
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # data.spec.js asserts demo_parcels/main exists (the Vector Tiles panel reads
      # real MVT off it), and platform-up.sh is what seeds it outside CI.
      - name: Seed the demo real-estate dataset
        working-directory: viewtopia
        run: node scripts/seed-parcels.mjs

      - name: Run per-panel functional suite
        working-directory: viewtopia
        run: pnpm run test:e2e:panels

      # the config has no html reporter, so this is the failure context and traces
      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: panels-test-results
          path: viewtopia/test-results/

      - name: Dump service logs on failure
        if: failure()
        working-directory: viewtopia
        run: docker compose -f docker-compose.platform.yml logs --no-color --tail=200
