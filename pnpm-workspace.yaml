# pnpm settings (pnpm 11 reads project settings from here, not package.json).
#
# Security: pnpm blocks dependency lifecycle/build scripts by default. Only the
# packages listed here are allowed to run install scripts — keep this list small
# and audited. esbuild downloads its platform binary (required by Vite);
# protobufjs's postinstall is benign but flagged.
allowBuilds:
  esbuild: true
  protobufjs: true

# Force patched versions of dev-only advisories (undici via jsdom/vitest,
# @babel/core via @vitejs/plugin-react). Nothing here ships to users; the
# overrides just keep the audit clean.
overrides:
  undici: "^7.29.0"
  "@babel/core": ">=7.29.1"
