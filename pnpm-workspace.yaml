allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: true

# Force patched versions of advisories in transitive deps. undici,
# @babel/core and fast-uri are dev-only. maplibre-gl 5 comes from @panoramax/web-viewer,
# whose photo viewer entry (the only one we load) never imports it. fflate
# 0.7 comes from @loaders.gl/compression, which only calls the one-argument
# sync functions that 0.8 kept.
overrides:
  undici: "^7.29.0"
  "@babel/core": "^7.29.1"
  fast-uri: "^4.0.0"
  maplibre-gl: "^6.10.0"
  fflate: "^0.8.3"
  # texture-compressor is a node-only encoder nothing here runs
  image-size: "^2.0.3"

# flatgeobuf ships an OpenLayers adapter we never import, and it drags in
# openlayers, a geotiff beta and zarrita. only the geojson module is used.
ignoredOptionalDependencies:
  - ol
