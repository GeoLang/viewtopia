# pnpm settings (pnpm 11 reads project settings from here, not package.json).
#
# Security: pnpm blocks dependency lifecycle/build scripts by default. Only the
# packages listed here are allowed to run install scripts — keep this list small
# and audited. esbuild downloads its platform binary (required by Vite);
# protobufjs's postinstall is benign but flagged. core-js arrives as an optional
# dependency of jspdf and its postinstall only prints a funding banner.
allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: true

# Force patched versions of advisories in transitive deps. undici,
# @babel/core and fast-uri are dev-only. maplibre-gl 5 comes from @panoramax/web-viewer,
# whose photo viewer entry (the only one we load) never imports it. fflate
# 0.7 comes from @loaders.gl/compression, which only calls the one-argument
# sync functions that 0.8 kept.
overrides:
  undici: "^7.29.0"
  "@babel/core": "^7.29.1"
  fast-uri: "^3.1.8"
  maplibre-gl: "^6.10.0"
  fflate: "^0.8.3"

# flatgeobuf ships an OpenLayers adapter we never import, and it drags in
# openlayers, a geotiff beta and zarrita. only the geojson module is used.
ignoredOptionalDependencies:
  - ol
