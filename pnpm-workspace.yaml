allowBuilds:
  esbuild: true
  protobufjs: true

# Force patched versions of dev-only advisories (undici via jsdom/vitest,
# @babel/core via @vitejs/plugin-react). Nothing here ships to users; the
# overrides just keep the audit clean.
overrides:
  undici: "^7.29.0"
  "@babel/core": "^8.0.0"

# flatgeobuf ships an OpenLayers adapter we never import, and it drags in
# openlayers, a geotiff beta and zarrita. only the geojson module is used.
ignoredOptionalDependencies:
  - ol
