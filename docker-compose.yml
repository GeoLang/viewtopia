version: "3.8"

# ViewTopia full stack — one command to run everything
# Usage: docker compose up --build

services:
  # TileTopia — Rust geospatial server (3D Tiles, terrain, asset management)
  tiletopia:
    build:
      context: ../tiletopia
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - tiletopia-data:/data
    environment:
      - TILETOPIA_DATA_DIR=/data
      - TILETOPIA_HOST=0.0.0.0
      - TILETOPIA_PORT=3000
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # GeoLang — Python AI/NLP geospatial server + tool executor
  geolang:
    build:
      context: ../geolang
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - geolang-cache:/app/cache
    environment:
      - SIBYL_URL=http://sibyl:8090
    depends_on:
      - sibyl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Sibyl — Rust agent loop service (LLM calls, sessions, tool dispatch)
  sibyl:
    build:
      context: ../sibyl
    ports:
      - "8090:8090"
    environment:
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GEOLANG_URL=http://geolang:8080
    volumes:
      - sibyl-data:/data

  # ViewTopia — Vite dev server (or static build for production)
  viewtopia:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_TILETOPIA_URL=http://tiletopia:3000
      - VITE_GEOLANG_URL=http://geolang:8080
    depends_on:
      tiletopia:
        condition: service_healthy
      geolang:
        condition: service_healthy

volumes:
  tiletopia-data:
  geolang-cache:
  sibyl-data:
