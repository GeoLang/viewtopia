# TileTopia Full Platform — All Services
#
# One command to run the complete GIS platform:
#   docker compose -f docker-compose.platform.yml up --build
#
# Services:
#   - db:         PostGIS 16 database (port 5432)
#   - ptolemy:    Enterprise geodatabase + geoprocessing API (port 3000)
#   - fenestra:   OGC WMS/WFS/WMTS gateway with server-side rendering (port 3003)
#   - tiletopia:  3D Tiles / terrain / asset server (port 3100)
#   - geokode:    Geocoding service (port 3001)
#   - itinera:    Routing + isochrones (port 3002)
#   - geolang:    AI/NLP geospatial agent (port 8080)
#   - letta:      Agent memory server (port 8283)
#   - viewtopia:  Frontend viewer + A2UI (port 5174)
#
# Prerequisites:
#   - Place OSM extract at ./data/region.osm.pbf (for routing)
#   - Place address CSV at ./data/addresses.csv (for geocoding)
#   - Or remove itinera/geokode services if not needed

services:
  # ── Database ──────────────────────────────────────────────────────

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ptolemy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptolemy}
      POSTGRES_DB: ptolemy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptolemy"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ── Core Services ─────────────────────────────────────────────────

  ptolemy:
    build:
      context: ../ptolemy
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ptolemy:${POSTGRES_PASSWORD:-ptolemy}@db/ptolemy
      RUST_LOG: info,ptolemy_api=debug
    ports:
      - "3000:3000"
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tiletopia:
    build:
      context: ../tiletopia
    ports:
      - "3100:3000"
    volumes:
      - tiletopia-data:/data
    environment:
      TILETOPIA_DATA_DIR: /data
      TILETOPIA_HOST: 0.0.0.0
      TILETOPIA_PORT: "3000"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  fenestra:
    build:
      context: ../fenestra
    depends_on:
      ptolemy:
        condition: service_healthy
    environment:
      RUST_LOG: info,fenestra=debug
      FENESTRA_HOST: 0.0.0.0
      FENESTRA_PORT: "8080"
      PTOLEMY_URL: http://ptolemy:3000
    ports:
      - "3003:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Spatial Services ──────────────────────────────────────────────

  geokode:
    build:
      context: ../geokode
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data:ro
    command:
      - serve
      - --data
      - /data/addresses.csv
      - --bind
      - "0.0.0.0:3000"

  itinera:
    build:
      context: ../itinera
    ports:
      - "3002:3000"
    environment:
      RUST_LOG: info
    volumes:
      - ./data:/data
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
      - --graph
      - /data/graph.bin

  # ── AI / Agent Layer ──────────────────────────────────────────────

  letta:
    image: letta/letta:latest
    ports:
      - "8283:8283"
    volumes:
      - letta-data:/root/.letta
    environment:
      - LETTA_SERVER_PASSWORD=${LETTA_PASSWORD:-}

  geolang:
    build:
      context: ../geolang
      dockerfile: Dockerfile
    ports:
      - "8080:8283"
    volumes:
      - geolang-cache:/app/cache
      # geolang runs its tools from a bind-mounted repo root (see geolang/docker-compose.yml)
      - ../geolang:/app/geolang:z
    env_file:
      - ../geolang/.env
    environment:
      GEOLANG_HOST: 0.0.0.0
      GEOLANG_PORT: "8283"
      TOOL_EXEC_DIR: "/app/geolang"
      TOOL_EXEC_VENV_NAME: "env"
      LETTA_BASE_URL: http://letta:8283
      PTOLEMY_URL: http://ptolemy:3000
      TILETOPIA_URL: http://tiletopia:3000
      GEOKODE_URL: http://geokode:3000
      ITINERA_URL: http://itinera:3000
    depends_on:
      - letta
      - ptolemy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend ──────────────────────────────────────────────────────

  viewtopia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PTOLEMY_URL: http://localhost:3000
        VITE_TILETOPIA_URL: http://localhost:3100
        VITE_GEOCODE_URL: http://localhost:3001
        VITE_ROUTING_URL: http://localhost:3002
        VITE_GEOLANG_URL: http://localhost:8080
    ports:
      - "5174:5174"
    volumes:
      - ./deploy/nginx-platform.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ptolemy:
        condition: service_healthy
      tiletopia:
        condition: service_healthy
      geolang:
        condition: service_healthy

volumes:
  pgdata:
  tiletopia-data:
  geolang-cache:
  letta-data:
