# TileTopia Full Platform — All Services
#
# One command to run the complete GIS platform:
#   scripts/platform-up.sh
#
# Use that script (or pass --env-file .env.platform yourself): it generates the
# shared PLATFORM_JWT_SECRET the JWT-validating services need. Without it
# ptolemy and tiletopia refuse to start rather than serve unauthenticated
# writes. Tokens minted by tiletopia's /api/v1/auth/login validate at ptolemy
# because both sign the same secret with the same {sub, exp, role} claims.
#
# Services:
#   - db:         PostGIS 16 database (port 5432)
#   - ptolemy:    Enterprise geodatabase + geoprocessing API (port 3000)
#   - fenestra:   OGC WMS/WFS/WMTS gateway with server-side rendering (:5174/ogc/, port 3003)
#   - tiletopia:  3D Tiles / terrain / asset server (port 3100)
#   - geokode:    Geocoding service (port 3001)
#   - itinera:    Routing + isochrones (port 3002)
#   - sibyl:      Rust agent loop service (internal port 8090)
#   - geodukt:    Declarative pipeline runner for agent plans (internal port 8100)
#   - geolang-api: AI/NLP geospatial agent API + tool executor (port 8080)
#   - viewtopia:  Frontend viewer + A2UI (port 5174)
#
# Prerequisites:
#   - Place OSM extract at ./data/region.osm.pbf (for routing)
#   - Place address CSV at ./data/addresses.csv (for geocoding)
#   - Or remove itinera/geokode services if not needed

services:
  # ── Database ──────────────────────────────────────────────────────

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ptolemy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptolemy}
      POSTGRES_DB: ptolemy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptolemy"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ── Core Services ─────────────────────────────────────────────────

  ptolemy:
    build:
      context: ../ptolemy
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ptolemy:${POSTGRES_PASSWORD:-ptolemy}@db/ptolemy
      RUST_LOG: info,ptolemy_api=debug
      PTOLEMY_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
    ports:
      - "3000:3000"
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tiletopia:
    build:
      context: ../tiletopia
    ports:
      - "3100:3000"
    volumes:
      - tiletopia-data:/data
    environment:
      TILETOPIA_DATA_DIR: /data
      TILETOPIA_HOST: 0.0.0.0
      TILETOPIA_PORT: "3000"
      RUST_LOG: info
      TILETOPIA_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  fenestra:
    build:
      context: ../fenestra
    depends_on:
      ptolemy:
        condition: service_healthy
    environment:
      RUST_LOG: info,fenestra=debug
      FENESTRA_HOST: 0.0.0.0
      FENESTRA_PORT: "8080"
      PTOLEMY_URL: http://ptolemy:3000
      # capabilities embed absolute URLs; they have to point back through the
      # viewtopia proxy's /ogc/ mount, not at fenestra's bind address.
      FENESTRA_PUBLIC_URL: ${FENESTRA_PUBLIC_URL:-http://localhost:5174/ogc}
    # 3003 stays published for dev; the proxy route at :5174/ogc/ is the real one.
    ports:
      - "3003:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Spatial Services ──────────────────────────────────────────────

  geokode:
    build:
      context: ../geokode
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data:ro
    command:
      - serve
      - --data
      # Real Monaco addresses from the OSM extract (geokode's PBF importer),
      # aligned with the itinera routing graph. Swap for an OpenAddresses CSV
      # or a larger Geofabrik .pbf to widen coverage.
      - /data/region.osm.pbf
      - --bind
      - "0.0.0.0:3000"

  itinera:
    build:
      context: ../itinera
    ports:
      - "3002:3000"
    environment:
      RUST_LOG: info
    # no `user:` needed: itinera's entrypoint starts as root and drops to the
    # owner of /data, so the auto-import can write graph.bin into ./data
    volumes:
      - ./data:/data
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
      - --graph
      - /data/graph.bin

  # ── AI / Agent Layer ──────────────────────────────────────────────

  # Rust agent loop service: calls the LLM, dispatches tool calls to
  # geolang-api's /tools endpoints, stores sessions + history in sqlite.
  # Internal only, nginx never routes here; geolang-api proxies /chat/agui runs.
  # The tool manifest is fetched lazily from geolang-api, so no startup ordering
  # dependency exists between the two.
  sibyl:
    build:
      context: ../sibyl
    # published for the dashboard's host-side health probe
    ports:
      - "8090:8090"
    volumes:
      - sibyl-data:/data
    # provides XAI_API_KEY; optional so panels/load CI (no geolang checkout) still parses
    env_file:
      - path: ../geolang/.env
        required: false
    environment:
      GEOLANG_URL: http://geolang-api:8080
      # set SIBYL_API_BASE=http://host.docker.internal:<port>/v1 (plus
      # SIBYL_MODEL) to use a local llama-server on the host instead of x.ai
      SIBYL_API_BASE: ${SIBYL_API_BASE:-}
      SIBYL_MODEL: ${SIBYL_MODEL:-}
      SIBYL_THINKING: ${SIBYL_THINKING:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Declarative pipeline runner: geolang's plan_workflow/run_workflow tools POST
  # TOML manifests to /validate and /run. Internal only, nothing else calls it,
  # so no published port. Port 8100 rather than geodukt's own 8080 default, which
  # is geolang's documented port.
  # Manifest paths ("outputs/foo.gpkg") are relative to geolang's exec dir, so
  # geodukt reads and writes through the same bind mount from the same cwd.
  geodukt:
    build:
      context: ../geodukt
    volumes:
      - ../geolang:/app/geolang:z
    working_dir: /app/geolang
    command:
      - serve
      - --bind
      - "0.0.0.0:8100"

  # geolang's public FastAPI app (src/api/server.py — the /chat/agui SSE API the
  # viewer talks to) plus the tool manifest/executor endpoints sibyl calls.
  # Tools run in-process here; nginx routes /agent/ here.
  geolang-api:
    build:
      context: ../geolang
      dockerfile: Dockerfile
    image: geolang-platform:latest
    ports:
      - "8080:8080"
    volumes:
      - geolang-cache:/app/cache
      # geolang runs its tools from a bind-mounted repo root (see geolang/docker-compose.yml)
      - ../geolang:/app/geolang:z
    # optional: panels/load CI don't check out geolang, and compose must still parse
    env_file:
      - path: ../geolang/.env
        required: false
    environment:
      SIBYL_URL: http://sibyl:8090
      TOOL_EXEC_DIR: "/app/geolang"
      PTOLEMY_URL: http://ptolemy:3000
      TILETOPIA_URL: http://tiletopia:3000
      GEOKODE_URL: http://geokode:3000
      ITINERA_URL: http://itinera:3000
      GEODUKT_URL: http://geodukt:8100
    depends_on:
      - sibyl
      - geodukt
    # nginx routes /agent/ here, and the viewer probes /agent/health on every page
    # load, so a stack without this container answers that probe with a 502. The
    # check gives callers (CI wait loops, compose ps) a way to wait for it.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # the geo stack preload happens in a background thread, boot is fast now
      start_period: 60s

  # ── Notebooks (Python) ────────────────────────────────────────────
  #
  # Backs viewtopia's notebook python cells (src/notebooks/jupyter.ts) via the
  # Jupyter kernel WebSocket API. scipy-notebook ships numpy/pandas/matplotlib so
  # rich outputs (plots, DataFrame tables) render out of the box. nginx routes
  # /jupyter/ here; base_url=/jupyter keeps kernel WS paths correct behind the proxy.
  #
  # Env vars:
  #   JUPYTER_TOKEN — fixed auth token; MUST match DEFAULT_JUPYTER_TOKEN in
  #                   src/notebooks/jupyter.ts (default: viewtopia-local).
  jupyter:
    image: quay.io/jupyter/scipy-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-viewtopia-local}
    command:
      - start-notebook.py
      - --ServerApp.base_url=/jupyter
      - --ServerApp.allow_origin=*
      - --ServerApp.allow_remote_access=True
      - --ServerApp.trust_xheaders=True

  # ── Frontend ──────────────────────────────────────────────────────

  viewtopia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PTOLEMY_URL: http://localhost:3000
        VITE_TILETOPIA_URL: http://localhost:3100
        VITE_GEOCODE_URL: http://localhost:3001
        VITE_ROUTING_URL: http://localhost:3002
        VITE_GEOLANG_URL: http://localhost:8080
    ports:
      - "5174:5174"
    volumes:
      # see deploy/nginx-platform-include.conf: the stub is the single-file mount,
      # the real config comes through the directory mount so edits + `nginx -s reload`
      # work without a force-recreate
      - ./deploy/nginx-platform-include.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy:/etc/nginx/platform:ro
    # no geolang dep: nginx resolves /agent/ upstreams at request time, and the
    # panels/load CI jobs start the viewer without the agent (no geolang checkout)
    depends_on:
      ptolemy:
        condition: service_healthy
      tiletopia:
        condition: service_healthy

volumes:
  pgdata:
  tiletopia-data:
  geolang-cache:
  sibyl-data:
