# TileTopia Full Platform — All Services
#
# One command to run the complete GIS platform:
#   docker compose -f docker-compose.platform.yml up --build
#
# Services:
#   - db:         PostGIS 16 database (port 5432)
#   - ptolemy:    Enterprise geodatabase + geoprocessing API (port 3000)
#   - fenestra:   OGC WMS/WFS/WMTS gateway with server-side rendering (port 3003)
#   - tiletopia:  3D Tiles / terrain / asset server (port 3100)
#   - geokode:    Geocoding service (port 3001)
#   - itinera:    Routing + isochrones (port 3002)
#   - geolang:    AI/NLP geospatial agent (port 8080; embeds its own Letta server)
#   - viewtopia:  Frontend viewer + A2UI (port 5174)
#
# Prerequisites:
#   - Place OSM extract at ./data/region.osm.pbf (for routing)
#   - Place address CSV at ./data/addresses.csv (for geocoding)
#   - Or remove itinera/geokode services if not needed

services:
  # ── Database ──────────────────────────────────────────────────────

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ptolemy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptolemy}
      POSTGRES_DB: ptolemy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptolemy"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ── Core Services ─────────────────────────────────────────────────

  ptolemy:
    build:
      context: ../ptolemy
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ptolemy:${POSTGRES_PASSWORD:-ptolemy}@db/ptolemy
      RUST_LOG: info,ptolemy_api=debug
    ports:
      - "3000:3000"
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tiletopia:
    build:
      context: ../tiletopia
    ports:
      - "3100:3000"
    volumes:
      - tiletopia-data:/data
    environment:
      TILETOPIA_DATA_DIR: /data
      TILETOPIA_HOST: 0.0.0.0
      TILETOPIA_PORT: "3000"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  fenestra:
    build:
      context: ../fenestra
    depends_on:
      ptolemy:
        condition: service_healthy
    environment:
      RUST_LOG: info,fenestra=debug
      FENESTRA_HOST: 0.0.0.0
      FENESTRA_PORT: "8080"
      PTOLEMY_URL: http://ptolemy:3000
    ports:
      - "3003:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Spatial Services ──────────────────────────────────────────────

  geokode:
    build:
      context: ../geokode
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data:ro
    command:
      - serve
      - --data
      # Real Monaco addresses from the OSM extract (geokode's PBF importer),
      # aligned with the itinera routing graph. Swap for an OpenAddresses CSV
      # or a larger Geofabrik .pbf to widen coverage.
      - /data/region.osm.pbf
      - --bind
      - "0.0.0.0:3000"

  itinera:
    build:
      context: ../itinera
    ports:
      - "3002:3000"
    environment:
      RUST_LOG: info
    # match the host user so the auto-import can write graph.bin
    # into the bind-mounted ./data without a manual --user run
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/data
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
      - --graph
      - /data/graph.bin

  # ── AI / Agent Layer ──────────────────────────────────────────────
  #
  # NOTE: geolang is all-in-one — its entrypoint starts an embedded Letta server
  # (+ Postgres) inside this container and connects to it at LETTA_URL
  # (default http://localhost:8283). There is therefore NO separate `letta`
  # service: a standalone letta/letta container would be unused dead weight, and
  # geolang reads LETTA_URL (not LETTA_BASE_URL).

  # CPU embedding server for Letta memory recall (all-MiniLM-L6-v2, dim 384),
  # OpenAI-compatible /v1/embeddings. geolang's agent embedding_config points here
  # via VLLM_API_BASE. Downloads the (~90MB) model on first start.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2", "--port", "8000"]
    volumes:
      - embeddings-cache:/data
    # (TEI's image has no curl/wget, so no in-container healthcheck; the agent only
    # embeds on first chat, by which time the ~90MB model has loaded.)

  geolang:
    build:
      context: ../geolang
      dockerfile: Dockerfile
    image: geolang-platform:latest
    ports:
      - "8080:8283"
    volumes:
      - geolang-cache:/app/cache
      # geolang runs its tools from a bind-mounted repo root (see geolang/docker-compose.yml)
      - ../geolang:/app/geolang:z
      # persist the embedded letta postgres; without this every recreate
      # re-runs initdb (~50s boot) and loses agent state
      - geolang-pgdata:/var/lib/postgresql/data
    env_file:
      - ../geolang/.env
    environment:
      GEOLANG_HOST: 0.0.0.0
      GEOLANG_PORT: "8283"
      TOOL_EXEC_DIR: "/app/geolang"
      TOOL_EXEC_VENV_NAME: "env"
      PTOLEMY_URL: http://ptolemy:3000
      TILETOPIA_URL: http://tiletopia:3000
      GEOKODE_URL: http://geokode:3000
      ITINERA_URL: http://itinera:3000
    depends_on:
      - ptolemy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # letta's first boot (embedded postgres initdb + slow lifespan) can take
      # minutes on ci runners; probes during start_period don't count as failures
      start_period: 300s

  # geolang's public FastAPI app (src/api/server.py — the /chat/stream SSE API the
  # viewer talks to). Reuses the geolang image but bypasses the Letta entrypoint;
  # it connects to the Letta server in the `geolang` container and embeds via the
  # `embeddings` service. nginx routes /agent/ here (not at Letta).
  geolang-api:
    image: geolang-platform:latest
    entrypoint: []
    working_dir: /app/geolang
    command: ["python3", "-m", "uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ../geolang:/app/geolang:z
    env_file:
      - ../geolang/.env
    environment:
      LETTA_URL: http://geolang:8283
      VLLM_API_BASE: http://embeddings:8000
      # server.py runs in the image's /app/.venv (fastapi/uvicorn/letta) but its
      # geo endpoints (e.g. /geojson) lazily import geopandas, which lives in the
      # tool-exec venv. Bridge that venv's site-packages onto the path.
      PYTHONPATH: /app/geolang/env/lib/python3.11/site-packages
      PTOLEMY_URL: http://ptolemy:3000
      TILETOPIA_URL: http://tiletopia:3000
      GEOKODE_URL: http://geokode:3000
      ITINERA_URL: http://itinera:3000
    depends_on:
      geolang:
        condition: service_healthy
      embeddings:
        condition: service_started

  # ── Notebooks (Python) ────────────────────────────────────────────
  #
  # Backs viewtopia's notebook python cells (src/notebooks/jupyter.ts) via the
  # Jupyter kernel WebSocket API. scipy-notebook ships numpy/pandas/matplotlib so
  # rich outputs (plots, DataFrame tables) render out of the box. nginx routes
  # /jupyter/ here; base_url=/jupyter keeps kernel WS paths correct behind the proxy.
  #
  # Env vars:
  #   JUPYTER_TOKEN — fixed auth token; MUST match DEFAULT_JUPYTER_TOKEN in
  #                   src/notebooks/jupyter.ts (default: viewtopia-local).
  jupyter:
    image: quay.io/jupyter/scipy-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-viewtopia-local}
    command:
      - start-notebook.py
      - --ServerApp.base_url=/jupyter
      - --ServerApp.allow_origin=*
      - --ServerApp.allow_remote_access=True
      - --ServerApp.trust_xheaders=True

  # ── Frontend ──────────────────────────────────────────────────────

  viewtopia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PTOLEMY_URL: http://localhost:3000
        VITE_TILETOPIA_URL: http://localhost:3100
        VITE_GEOCODE_URL: http://localhost:3001
        VITE_ROUTING_URL: http://localhost:3002
        VITE_GEOLANG_URL: http://localhost:8080
    ports:
      - "5174:5174"
    volumes:
      - ./deploy/nginx-platform.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ptolemy:
        condition: service_healthy
      tiletopia:
        condition: service_healthy
      geolang:
        condition: service_healthy

volumes:
  pgdata:
  tiletopia-data:
  geolang-cache:
  geolang-pgdata:
  embeddings-cache:
