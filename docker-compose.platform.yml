# TileTopia Full Platform — All Services
#
# One command to run the complete GIS platform:
#   scripts/platform-up.sh
#
# Use that script (or pass --env-file .env.platform yourself): it generates the
# shared PLATFORM_JWT_SECRET the JWT-validating services need. Without it
# ptolemy and tiletopia refuse to start rather than serve unauthenticated
# writes. Tokens minted by tiletopia's /api/v1/auth/login validate at ptolemy
# because both sign the same secret with the same {sub, exp, role} claims.
#
# Services:
#   - db:         PostGIS 16 database (port 5432)
#   - ptolemy:    Enterprise geodatabase + geoprocessing API (port 3000)
#   - fenestra:   OGC WMS/WFS/WMTS gateway with server-side rendering (:5174/ogc/, port 3003)
#   - tiletopia:  3D Tiles / terrain / asset server (port 3100)
#   - geokode:    Geocoding service (port 3001)
#   - itinera:    Routing + isochrones (port 3002)
#   - interiora:  Indoor venue maps + indoor routing (internal port 3000)
#   - geoplumb:   Windowed raster tiles over STAC (:5174/plumb/, internal port 3000)
#   - agora:      Live shared map documents over websockets (:5174/agora/, internal port 3000)
#   - collecta:   Field data collection, OpenRosa + REST (:5174/collecta/, internal port 3000)
#   - sibyl:      Rust agent loop service (internal port 8090)
#   - geodukt:    Declarative pipeline runner for agent plans (internal port 8100)
#   - geolang-api: AI/NLP geospatial agent API (port 8080)
#   - geolang-executor: runs the tool code, holds no platform secret (internal)
#   - aavaaz:     Speech to text for the chat mic (:5174/speech/, internal)
#   - viewtopia:  Frontend viewer + A2UI (port 5174)
#
# Prerequisites:
#   - Place OSM extract at ./data/region.osm.pbf (for routing)
#   - Place address CSV at ./data/addresses.csv (for geocoding)
#   - Or remove itinera/geokode services if not needed
#   - Optional, speech only: Aavaaz checkout at ../../Aavaaz/aavaaz and an NVIDIA GPU

services:
  # ── Database ──────────────────────────────────────────────────────

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ptolemy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptolemy}
      POSTGRES_DB: ptolemy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb scripts run on a fresh volume only, see the script for the
      # one-time step an existing volume needs
      - ./deploy/init-agora-db.sh:/docker-entrypoint-initdb.d/init-agora-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptolemy"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ── Core Services ─────────────────────────────────────────────────

  ptolemy:
    build:
      context: ../ptolemy
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ptolemy:${POSTGRES_PASSWORD:-ptolemy}@db/ptolemy
      RUST_LOG: info,ptolemy_api=debug
      PTOLEMY_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
    ports:
      - "3000:3000"
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tiletopia:
    build:
      context: ../tiletopia
    ports:
      - "3100:3000"
    volumes:
      - tiletopia-data:/data
    environment:
      TILETOPIA_DATA_DIR: /data
      # built tileset archives, on the same volume so they survive a restart
      TILETOPIA_TILESET_DIR: /data/tilesets
      TILETOPIA_HOST: 0.0.0.0
      TILETOPIA_PORT: "3000"
      RUST_LOG: info
      TILETOPIA_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  fenestra:
    build:
      context: ../fenestra
    depends_on:
      ptolemy:
        condition: service_healthy
    environment:
      RUST_LOG: info,fenestra=debug
      FENESTRA_HOST: 0.0.0.0
      FENESTRA_PORT: "8080"
      PTOLEMY_URL: http://ptolemy:3000
      # capabilities embed absolute URLs; they have to point back through the
      # viewtopia proxy's /ogc/ mount, not at fenestra's bind address.
      FENESTRA_PUBLIC_URL: ${FENESTRA_PUBLIC_URL:-http://localhost:5174/ogc}
    # 3003 stays published for dev; the proxy route at :5174/ogc/ is the real one.
    ports:
      - "3003:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Spatial Services ──────────────────────────────────────────────

  geokode:
    build:
      context: ../geokode
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data:ro
    command:
      - serve
      - --data
      # Real Monaco addresses from the OSM extract (geokode's PBF importer),
      # aligned with the itinera routing graph. Swap for an OpenAddresses CSV
      # or a larger Geofabrik .pbf to widen coverage.
      - /data/region.osm.pbf
      - --bind
      - "0.0.0.0:3000"

  itinera:
    build:
      context: ../itinera
    ports:
      - "3002:3000"
    environment:
      RUST_LOG: info
    # no `user:` needed: itinera's entrypoint starts as root and drops to the
    # owner of /data, so the auto-import can write graph.bin into ./data
    volumes:
      - ./data:/data
    command:
      - serve
      - --bind
      - "0.0.0.0:3000"
      - --graph
      - /data/graph.bin

  # Indoor venue maps: floor GeoJSON and indoor routing for the viewer's Indoor
  # panel. Internal only, nginx routes /api/indoor/ here. Every /venues route
  # needs the shared platform token, and the server refuses to start without the
  # secret, so it is as mandatory here as it is for ptolemy.
  interiora:
    build:
      context: ../interiora
    environment:
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      INTERIORA_DATA_DIR: /data
      RUST_LOG: info
    volumes:
      - interiora-data:/data

  # Live shared map documents: websocket rooms with server-ordered ops,
  # presence, and role-bearing share links. nginx routes /agora/ here,
  # websockets included. Members present the shared platform token and
  # share-link sessions get short-lived tokens minted with the same secret,
  # so the secret is as mandatory here as it is for ptolemy. Its database
  # is separate from ptolemy's on the same instance: a fresh pgdata volume
  # creates it via deploy/init-agora-db.sh, an existing one needs the
  # one-time create the script's comment shows.
  agora:
    build:
      context: ../agora
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ptolemy:${POSTGRES_PASSWORD:-ptolemy}@db/agora
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      # project roles on documents resolve against ptolemy; unset disables
      # that and the members table alone decides
      PTOLEMY_URL: http://ptolemy:3000
      # region watches reduce over geoplumb layers; unset disables them
      GEOPLUMB_URL: http://geoplumb:3000
      RUST_LOG: info

  # Field data collection: OpenRosa server for ODK Collect in the field plus
  # the REST API the viewer's Collecta panel reads. nginx routes /collecta/
  # here. Platform tokens verify directly (same HS256 secret and {sub, exp,
  # role} claims as tiletopia), so the secret is as mandatory here as it is
  # for ptolemy, and the server refuses an empty one. ODK Collect signs in
  # with Basic auth against collecta's own user table, seeded with
  # `docker compose exec collecta collecta-server create-user <email>`.
  # COLLECTA_BASE_URL is what OpenRosa downloadUrls point back at, so it must
  # be the public /collecta prefix, not the container address.
  collecta:
    build:
      context: ../collecta
    environment:
      COLLECTA_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      COLLECTA_BASE_URL: ${COLLECTA_BASE_URL:-http://localhost:5174/collecta}
      # where publishing a form writes its dataset; unset answers 503
      COLLECTA_PTOLEMY_URL: http://ptolemy:3000
      RUST_LOG: info
    volumes:
      - collecta-data:/data

  # Windowed raster compute: renders XYZ png tiles out of public STAC
  # collections, each request naming the time interval to composite over, which
  # is what the viewer's Timelapse panel compares two of. Internal only, nginx
  # routes /plumb/ here. Public by decision, like tiletopia's public tiles, so
  # no platform token is involved. The layer file is mandatory: without
  # GEOPLUMB_LAYERS the server exits rather than invent a layer.
  geoplumb:
    build:
      context: ../geoplumb
    environment:
      GEOPLUMB_LAYERS: /etc/geoplumb/layers.toml
      # per layer, not in total, and the disk tier is 8x it again per layer:
      # the two layers below come to 256 MiB resident and 2 GiB spilled
      GEOPLUMB_CACHE_BYTES: 134217728
      GEOPLUMB_DISK_CACHE: /cache
      RUST_LOG: info
    volumes:
      - ./deploy/geoplumb-layers.toml:/etc/geoplumb/layers.toml:ro
      # the spill tier. The image chowns /cache to its non-root user, so a
      # fresh named volume inherits a writable dir. Every run spills into
      # its own pid-named subdir and nothing reaps the old ones, so this
      # volume is scratch to delete, not a cache worth keeping.
      - geoplumb-cache:/cache

  # ── AI / Agent Layer ──────────────────────────────────────────────

  # Rust agent loop service: calls the LLM, dispatches tool calls to
  # geolang-api's /tools endpoints, stores sessions + history in sqlite.
  # Internal only, nginx never routes here; geolang-api proxies /chat/agui runs.
  # The tool manifest is fetched lazily from geolang-api, so no startup ordering
  # dependency exists between the two.
  sibyl:
    build:
      context: ../sibyl
    # published for the dashboard's host-side health probe
    ports:
      - "8090:8090"
    volumes:
      - sibyl-data:/data
    # provides SIBYL_CLOUD_API_KEY and the rest of the SIBYL_CLOUD_* and
    # SIBYL_LOCAL_* model config, see geolang/.env.example. optional so
    # panels/load CI (no geolang checkout) still parses. an `environment`
    # entry for any of those names would hide the .env value, so none is listed
    env_file:
      - path: ../geolang/.env
        required: false
    environment:
      GEOLANG_URL: http://geolang-api:8080
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Declarative pipeline runner: geolang's plan_workflow/run_workflow tools POST
  # TOML manifests to /validate and /run. Internal only, nothing else calls it,
  # so no published port. Port 8100 rather than geodukt's own 8080 default, which
  # is geolang's documented port.
  # POST /run follows the shared platform secret like every other gated write,
  # so it needs an editor or admin token (platform-up.sh always generates the
  # secret). /validate and /operations are open either way, so headless planning
  # and the evals never need a token.
  geolang-data-init:
    build:
      context: ../geolang
      dockerfile: Dockerfile
    image: geolang-platform:latest
    user: "0:0"
    environment:
      DOCKER_UID: "${DOCKER_UID:-1000}"
      DOCKER_GID: "${DOCKER_GID:-1000}"
    volumes:
      - geolang-outputs:/app/geolang/outputs
      - geolang-user-data:/app/geolang/user_data
      - geolang-live-data:/app/geolang/live_data
      - geolang-natural-earth:/app/geolang/natural_earth
    command:
      - /bin/sh
      - -ec
      - >-
        chown "$$DOCKER_UID:$$DOCKER_GID" /app/geolang/outputs
        /app/geolang/user_data /app/geolang/live_data /app/geolang/natural_earth

  geodukt:
    build:
      context: ../geodukt
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - geolang-outputs:/app/geolang/outputs
      - geolang-user-data:/app/geolang/user_data
      - geolang-live-data:/app/geolang/live_data
    depends_on:
      geolang-data-init:
        condition: service_completed_successfully
    working_dir: /app/geolang
    environment:
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
    command:
      - serve
      - --bind
      - "0.0.0.0:8100"

  # Tool code runs here rather than in geolang-api, which holds
  # PLATFORM_JWT_SECRET: a tool hands caller-written arguments to geopandas,
  # QGIS and DuckDB, and that secret signs a token for any user on any service.
  # So no signing secret, no service account, no model key (hence no env_file)
  # and no published port. Natural Earth reference data is shared with the API.
  geolang-executor:
    build:
      context: ../geolang
      dockerfile: Dockerfile
    image: geolang-platform:latest
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - geolang-outputs:/app/geolang/outputs
      - geolang-user-data:/app/geolang/user_data
      - geolang-live-data:/app/geolang/live_data
      - geolang-natural-earth:/app/geolang/natural_earth
    depends_on:
      geolang-data-init:
        condition: service_completed_successfully
    environment:
      TOOL_EXEC_DIR: "/app/geolang"
      GEOLANG_EXECUTOR_SECRET: ${GEOLANG_EXECUTOR_SECRET:-}
      PTOLEMY_URL: http://ptolemy:3000
      TILETOPIA_URL: http://tiletopia:3000
      GEOKODE_URL: http://geokode:3000
      ITINERA_URL: http://itinera:3000
      GEODUKT_URL: http://geodukt:8100
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
      # the run-as uid has no passwd entry, so HOME would be an unwritable /
      HOME: /tmp
    command:
      - uvicorn
      - src.api.executor:app
      - --host
      - "0.0.0.0"
      - --port
      - "8081"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    pids_limit: 512
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # geolang's public FastAPI app (src/api/server.py — the /chat/agui SSE API the
  # viewer talks to) plus the tool manifest endpoints sibyl calls. Tool code runs
  # in geolang-executor, not here; nginx routes /agent/ here.
  geolang-api:
    build:
      context: ../geolang
      dockerfile: Dockerfile
    image: geolang-platform:latest
    ports:
      - "8080:8080"
    volumes:
      - geolang-cache:/app/cache
      - geolang-outputs:/app/geolang/outputs
      - geolang-user-data:/app/geolang/user_data
      - geolang-live-data:/app/geolang/live_data
      - geolang-natural-earth:/app/geolang/natural_earth
    # optional: panels/load CI don't check out geolang, and compose must still parse
    env_file:
      - path: ../geolang/.env
        required: false
    environment:
      SIBYL_URL: http://sibyl:8090
      # geolang refuses to start without named origins once the auth gate is on
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
      TOOL_EXEC_DIR: "/app/geolang"
      PTOLEMY_URL: http://ptolemy:3000
      TILETOPIA_URL: http://tiletopia:3000
      GEOKODE_URL: http://geokode:3000
      ITINERA_URL: http://itinera:3000
      GEODUKT_URL: http://geodukt:8100
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      GEOLANG_EXECUTOR_URL: http://geolang-executor:8081
      GEOLANG_EXECUTOR_SECRET: ${GEOLANG_EXECUTOR_SECRET:-}
    depends_on:
      geolang-data-init:
        condition: service_completed_successfully
      sibyl:
        condition: service_started
      geodukt:
        condition: service_started
      geolang-executor:
        condition: service_started
    # nginx routes /agent/ here, and the viewer probes /agent/health on every page
    # load, so a stack without this container answers that probe with a 502. The
    # check gives callers (CI wait loops, compose ps) a way to wait for it.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # the geo stack preload happens in a background thread, boot is fast now
      start_period: 60s

  # ── Speech to text (Aavaaz over WhisperLive) ─────────────────────
  #
  # The chat's mic streams audio here through nginx /speech/. Needs the nvidia
  # container runtime and the Aavaaz checkout beside the GeoLang directory, so
  # it sits behind the `speech` profile and a plain `up` skips it.
  # scripts/platform-up.sh adds --profile speech when the checkout and an
  # NVIDIA GPU are both present. By hand:
  #   docker compose --profile speech up -d --build aavaaz
  # No host port and no API key: only containers reach 9090, nginx is the route.
  #
  # Env vars:
  #   SPEECH_MODEL — whisper model (default large-v3-turbo, about 1.6 GB of
  #                  VRAM; `small` runs on a CPU-only box with Dockerfile.cpu)
  aavaaz:
    build:
      context: ../../Aavaaz/aavaaz
    profiles: [speech]
    command: ["--model", "${SPEECH_MODEL:-large-v3-turbo}"]
    environment:
      AAVAAZ_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
    volumes:
      - speech-models:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # the model downloads on first start
      start_period: 300s

  # ── Notebooks (Python) ────────────────────────────────────────────
  #
  # Backs viewtopia's notebook python cells (src/notebooks/jupyter.ts) via the
  # Jupyter kernel WebSocket API. scipy-notebook ships numpy/pandas/matplotlib so
  # rich outputs (plots, DataFrame tables) render out of the box. nginx routes
  # /jupyter/ here; base_url=/jupyter keeps kernel WS paths correct behind the proxy.
  #
  # Env vars:
  #   JUPYTER_TOKEN — fixed auth token; MUST match DEFAULT_JUPYTER_TOKEN in
  #                   src/notebooks/jupyter.ts (default: viewtopia-local).
  jupyter:
    image: quay.io/jupyter/scipy-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-viewtopia-local}
    command:
      - start-notebook.py
      - --ServerApp.base_url=/jupyter
      - --ServerApp.allow_origin=*
      - --ServerApp.allow_remote_access=True
      - --ServerApp.trust_xheaders=True

  # ── Frontend ──────────────────────────────────────────────────────

  viewtopia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PTOLEMY_URL: http://localhost:3000
        VITE_TILETOPIA_URL: http://localhost:3100
        VITE_GEOCODE_URL: http://localhost:3001
        VITE_ROUTING_URL: http://localhost:3002
        VITE_GEOLANG_URL: http://localhost:8080
    ports:
      - "5174:5174"
    volumes:
      # see deploy/nginx-platform-include.conf: the stub is the single-file mount,
      # the real config comes through the directory mount so edits + `nginx -s reload`
      # work without a force-recreate
      - ./deploy/nginx-platform-include.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy:/etc/nginx/platform:ro
    # no geolang dep: nginx resolves /agent/ upstreams at request time, and the
    # panels/load CI jobs start the viewer without the agent (no geolang checkout)
    depends_on:
      ptolemy:
        condition: service_healthy
      tiletopia:
        condition: service_healthy

volumes:
  pgdata:
  tiletopia-data:
  geolang-cache:
  geolang-outputs:
  geolang-user-data:
  speech-models:
  geolang-live-data:
  geolang-natural-earth:
  sibyl-data:
  interiora-data:
  geoplumb-cache:
  collecta-data:
